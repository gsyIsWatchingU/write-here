[program:write-here]
command=/workspace/.tools/node-v20/bin/node backend/server.js
directory=/workspace/projects/write-here
environment=PATH="/workspace/.tools/node-v20/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",NODE_ENV="production",HOST="0.0.0.0",PORT="3210",TZ="Asia/Shanghai"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=70
stdout_logfile=/workspace/projects/write-here/logs/supervisor-app.out.log
stderr_logfile=/workspace/projects/write-here/logs/supervisor-app.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
