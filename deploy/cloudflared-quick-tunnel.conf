[program:cloudflared-write-here]
command=/workspace/.tools/bin/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3210
directory=/workspace/projects/write-here
environment=TZ="Asia/Shanghai"
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
priority=80
stdout_logfile=/workspace/projects/write-here/logs/cloudflared.out.log
stderr_logfile=/workspace/projects/write-here/logs/cloudflared.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
