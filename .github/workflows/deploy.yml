name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: write-here-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: 构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            mcp/package-lock.json

      - name: 安装依赖
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix mcp

      - name: 构建前端
        run: npm run build --prefix frontend

      - name: 检查后端语法
        run: node --check backend/server.js

      - name: 测试题目发布接口
        run: npm test --prefix backend

      - name: 检查并测试 MCP 服务
        run: npm run check --prefix mcp && npm test --prefix mcp

      - name: 生成部署包
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/write-here-${GITHUB_SHA}.tar.gz"
          trap 'rm -f .deploy-manifest' EXIT
          git ls-files | grep -v '^db/' > .deploy-manifest
          tar --verbatim-files-from -czf "$archive" -T .deploy-manifest .deploy-manifest

      - name: 上传部署包
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: write-here-${{ github.sha }}
          path: ${{ runner.temp }}/write-here-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: 部署到 GPU 服务器
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, write-here-gpu]
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_PATH: /workspace/projects/write-here
    steps:
      - name: 下载部署包
        uses: actions/download-artifact@v4
        with:
          name: write-here-${{ github.sha }}
          path: ${{ runner.temp }}/write-here-release

      - name: 检查部署目标
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" == "/workspace/projects/write-here" ]]
          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/db/docs.db"

      - name: 发布并验证
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ARCHIVE="$RUNNER_TEMP/write-here-release/write-here-${GITHUB_SHA}.tar.gz"
          [[ "$DEPLOY_PATH" == "/workspace/projects/write-here" ]]
          release_name="$(basename "$DEPLOY_ARCHIVE")"
          release_name="${release_name#write-here-}"
          release_name="${release_name%.tar.gz}"
          if [[ ! "$release_name" =~ ^[0-9a-f]{40}$ ]]; then
            echo "非法发布版本：$release_name" >&2
            exit 1
          fi
          release_dir="$DEPLOY_PATH/.deploy-tmp/release-$release_name"
          [[ "$release_dir" == "$DEPLOY_PATH/.deploy-tmp/release-$GITHUB_SHA" ]]

          test -f "$DEPLOY_ARCHIVE"
          test -f "$DEPLOY_PATH/db/docs.db"
          mkdir -p "$DEPLOY_PATH/.deploy-tmp"
          rm -rf -- "$release_dir"
          mkdir -p "$release_dir"
          trap 'rm -f "$DEPLOY_ARCHIVE"; rm -rf -- "$release_dir"' EXIT
          tar -xzf "$DEPLOY_ARCHIVE" -C "$release_dir"
          bash "$release_dir/deploy/apply-release.sh" "$release_dir" "$DEPLOY_PATH"

          cd "$DEPLOY_PATH"
          bash deploy/start.sh
          bash deploy/verify-public.sh
          printf '%s\n' "$release_name" > "$DEPLOY_PATH/run/deployed-commit"
          echo "已部署并验证版本：$release_name"
